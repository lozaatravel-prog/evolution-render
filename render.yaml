services:
  - type: web
    name: evolution-lozaa
    runtime: image
    image:
      url: docker.io/evoapicloud/evolution-api:latest
    plan: free
    region: virginia
    healthCheckPath: /
    envVars:
      - key: SERVER_TYPE
        value: http
      - key: SERVER_PORT
        value: "8080"
      - key: PORT
        value: "8080"
      - key: SERVER_URL
        value: https://evolution-lozaa.onrender.com
      - key: DEL_INSTANCE
        value: "false"
      - key: AUTHENTICATION_API_KEY
        generateValue: true
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        fromDatabase:
          name: evolution-db
          property: connectionString
      - key: DATABASE_CONNECTION_CLIENT_NAME
        value: evolution_lozaa
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "true"
      - key: DATABASE_SAVE_MESSAGE_UPDATE
        value: "true"
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "true"
      - key: DATABASE_SAVE_DATA_CHATS
        value: "true"
      - key: DATABASE_SAVE_DATA_LABELS
        value: "false"
      - key: DATABASE_SAVE_DATA_HISTORIC
        value: "false"
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "true"
      - key: TYPEBOT_ENABLED
        value: "true"
      - key: TYPEBOT_API_VERSION
        value: latest
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: Evolution API
      - key: CONFIG_SESSION_PHONE_NAME
        value: Chrome
      - key: LANGUAGE
        value: pt-BR
      - key: LOG_LEVEL
        value: ERROR,WARN,INFO,DEBUG,LOG,VERBOSE
      - key: QRCODE_LIMIT
        value: "30"

databases:
  - name: evolution-db
    plan: free
    region: virginia
    databaseName: evolution
    user: evolution
